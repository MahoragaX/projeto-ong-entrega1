<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Voluntários - AcolheTech</title>
</head>
<body>

    <header>
        <h1>AcolheTech</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos e Voluntariado</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="cadastro">
            <h2>Formulário de Cadastro de Voluntários</h2>
            <p>Preencha seus dados para analisarmos seu perfil.</p>

            <img src="imagens/cadastro.jpg" alt="Espaço reservado para imagem de cadastro" width="500">

            <form action="#" method="post">
                
                <fieldset>
                    <legend>Dados Pessoais</legend>

                    <div>
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="nome_completo" required>
                    </div>
                    <div>
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required placeholder="seuemail@dominio.com">
                    </div>
                    <div>
                        <label for="nascimento">Data de Nascimento:</label>
                        <input type="date" id="nascimento" name="data_nascimento" required>
                    </div>
                    <div>
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" 
                               pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" 
                               placeholder="123.456.789-00" required>
                    </div>
                    <div>
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" 
                               pattern="\(\d{2}\)\s\d{4,5}-\d{4}" 
                               placeholder="(11) 98765-4321" required>
                    </div>
                </fieldset>
                
                <fieldset>
                    <legend>Endereço</legend>

                    <div>
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" name="cep" 
                               pattern="\d{5}-\d{3}" 
                               placeholder="01234-567" required>
                    </div>
                    <div>
                        <label for="endereco">Endereço (Rua, N°):</label>
                        <input type="text" id="endereco" name="endereco" required>
                    </div>
                    <div>
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" required>
                    </div>
                    <div>
                        <label for="estado">Estado:</label>
                        <input type="text" id="estado" name="estado" required>
                    </div>
                </fieldset>

                <div>
                    <button type="submit">Enviar Cadastro</button>
                    <button type="reset">Limpar Campos</button>
                </div>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 AcolheTech. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
